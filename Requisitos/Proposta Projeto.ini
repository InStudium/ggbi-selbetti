🚀 PROJETO PEOPLE ANALYTICS | Selbetti

📌 Frente 1 — Inteligência de Pessoas

🎯 Objetivo Geral

Desenvolver uma plataforma de BI de People Analytics com indicadores estratégicos que permitam acompanhar, prever e direcionar decisões relacionadas a desempenho humano, produtividade e engajamento, inicialmente estruturada nos pilares:

PDI – Planos de Desenvolvimento Individual

Planejamento Educacional

Treinamentos e Desenvolvimento

Inovação e Competências

Turnover e Movimentações

✅ Escopo da Primeira Entrega

Criação do Painel Executivo de People Analytics – MVP com foco em 5 grandes módulos:

Módulo	Indicadores
Turnover e Retenção	Turnover voluntário; involuntário; por área; por tempo de casa; custo do desligamento; risco de rotatividade (insights preditivos na evolução)
Desenvolvimento e Aprendizagem	Participação em treinamentos; horas de capacitação; aderência ao plano educacional; avaliações de eficácia
PDIs	Aderência aos PDIs; evolução de competências; % de PDIs concluídos vs. planejados; indicadores por área/liderança
Engajamento e Clima (Próxima fase)	NPS de liderança; resultados de pesquisa de clima; alertas comportamentais
Inovação e Competências Estratégicas	Mapeamento de skills; gaps críticos; performance em trilhas estratégicas
🧱 Arquitetura Tecnológica Proposta

A solução será composta por:

1️⃣ Coleta e Integração de Dados

ADP ou Sistema de Folha | Dados cadastrais, movimentações e desligamentos

LMS/T&D | Treinamentos, trilhas e avaliações

Sistema de PDI | Evolução e conclusão dos planos

Sistema de Inovação | Registros de iniciativas e pontuações

🟡 Fase 2: Atrelamento ao Power BI Embedded para compartilhamento seguro

2️⃣ Base de Dados

Data Warehouse / Data Lake corporativo

Automação de ETL com Governança de Dados

3️⃣ Camada de Análise

Power BI (Visualização)

SQL (Tratamento e Modelagem)

Python/R (com modelos preditivos fase 3)

📌 Padrões alinhados às práticas da Diretoria de Governança e Engenharia de Dados.

📍 Metodologia do Projeto
Etapa	Deliverable	Responsável	Duração
1. Descoberta de Negócio	Mapeamento dos requisitos, entrevistas com G&G e Sinergia	Você + G&G	2 semanas
2. Arquitetura e Modelagem de Dados	Dicionário, validação de fontes, estrutura relacional	Engenharia de Dados + Você	3 semanas
3. ETL e Governança	Pipelines automáticos, limpeza e rastreabilidade	Engenharia de Dados	4 semanas
4. Design & Construção do Dashboard MVP	MVP do Painel Executivo People Analytics	Você	4 semanas
5. Validação e Ajustes	Feedback das lideranças, refinamento visual	Você + G&G	2 semanas
6. Apresentação Executiva	Demonstração para diretoria, plano de expansão	Você	1 semana

📌 Tempo total: 3 meses para o MVP executivo

🏗 Recursos Necessários
Recurso	Justificativa
Acesso às bases: folha, LMS, G&G	Fonte de dados primária
Power BI Pro	Criação e compartilhamento
Apoio Engenharia de Dados (0,2 FTE)	ETL, governança e integrações
Apoio de G&G	Validação dos indicadores e leitura de negócio
Possível aquisição futura de People Analytics ou HRIS	Escalabilidade Fase 2/3
